[window]
decorations = "Buttonless"
startup_mode = "Windowed"
padding = { x = 0, y = 0 }
dynamic_title = false
title = "Terminal"
opacity = 0.95

[terminal]
shell = { program = "powershell", args = ["-NoLogo", "-NoExit"] }

[keyboard]
bindings = [
	{ key = "B", mods = "Alt", chars = "\u001bb" },
	{ key = "B", mods = "Control|Alt", chars = "\u001b\u0002" },
]

[cursor]
style = { shape = "Block", blinking = "Always" }
blink_interval = 500

[scrolling]
history = 0
multiplier = 0

[font.normal]
family = "JetBrainsMono NF"
style = "Medium"

[font.bold]
family = "JetBrainsMono NF"
style = "Bold"

[font.italic]
family = "JetBrainsMono NF"
style = "Italic"

[font]
size = 10.0

[colors.primary]
background = "#141415"
foreground = "#dddddd"
bright_foreground = "#eeeeee"

[colors.normal]
black = "#333333"
red = "#aa3355"
green = "#44dd88"
yellow = "#ee9944"
blue = "#3366bb"
magenta = "#663399"
cyan = "#00bbcc"
white = "#bbbbbb"

[colors.bright]
black = "#555555"
red = "#cc6666"
green = "#99dd55"
yellow = "#eedd00"
blue = "#0099cc"
magenta = "#881177"
cyan = "#22ccbb"
white = "#cccccc"
